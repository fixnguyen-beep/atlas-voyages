name: Update travel trends
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-travel-trends
  cancel-in-progress: false
jobs:
  update-trends:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install requests
      - name: Generate trends
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/update_trends.py
      - name: Validate output
        run: python -m json.tool data/trends.json > /dev/null
      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/trends.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update sourced travel trends'
            git push origin HEAD:main
          fi
