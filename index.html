<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 ouvertures hôtelières</title><style>:root{--bg:#f7f4ed;--ink:#263027;--green:#405943;--line:#ddd7cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header,main,footer{padding:38px 5%;max-width:1300px;margin:auto}h1{font-size:clamp(40px,6vw,70px);font-weight:normal}.meta,p{font:14px/1.6 Arial;color:#687068}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:15px;padding:18px}.rank{display:inline-block;background:#e6eee6;padding:5px 9px;border-radius:12px;font:11px Arial}.card a{color:var(--green)}.cta{display:inline-block;background:var(--green);color:white;text-decoration:none;padding:12px 18px;border-radius:22px}</style></head><body><header><a class="cta" href="./atlas.html">Voir l’Atlas</a><h1>20 ouvertures récentes ou annoncées.</h1><p id="meta"></p></header><main><div id="grid" class="grid"></div></main><footer>Disponibilités et dates à confirmer auprès des établissements.</footer><script>const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const U=s=>{try{let u=new URL(s);return u.protocol==='https:'?u.href:'#'}catch{return'#'}};const F=s=>s?new Date(s).toLocaleDateString('fr-FR'):'date à confirmer';fetch('./data/trends.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{meta.textContent='Dernière mise à jour : '+F(d.generated_at);let a=(d.hotel_openings||[]).slice(0,20);grid.innerHTML=a.length?a.map((h,i)=>`<article class="card"><span class="rank">${i+1}/20 · ${E(h.country)} · ${E(h.city)}</span><h2>${E(h.hotel_name)}</h2><p><b>Ouverture :</b> ${F(h.opened_in)}</p><p>${E(h.summary)}</p><p><a target="_blank" rel="noopener" href="${U(h.official_url)}">Site officiel</a> · <a target="_blank" rel="noopener" href="${U(h.source_url)}">${E(h.source_publisher)}</a></p></article>`).join(''):'<p>Lancez le workflow pour alimenter les 20 ouvertures sourcées.</p>'}).catch(()=>grid.innerHTML='<p>Impossible de charger les données.</p>');</script></body></html>
