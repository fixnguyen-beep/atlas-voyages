name: Update travel intelligence
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-travel-intelligence
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Generate sourced travel intelligence
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: gpt-4.1-mini
          OPENAI_EXTRACT_MODEL: gpt-4o-mini
          ATLAS_BATCH_SIZE: '5'
        run: python scripts/update_trends.py
      - name: Validate JSON
        run: |
          python -m json.tool data/catalog.json > /dev/null
          python -m json.tool data/trends.json > /dev/null
      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/trends.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update sourced travel intelligence'
            git push origin HEAD:main
          fi
