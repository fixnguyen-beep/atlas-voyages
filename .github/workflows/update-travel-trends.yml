name: Update travel intelligence v3
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-travel-intelligence-v3
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Generate recommendations
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_MODEL: gpt-4.1-mini
          OPENAI_EXTRACT_MODEL: gpt-4o-mini
          ATLAS_HOTELS_PER_PROFILE: '10'
          ATLAS_HOTEL_OPENINGS: '20'
          ATLAS_MAX_PASSES: '3'
        run: python scripts/update_trends.py
        timeout-minutes: 120
      - name: Validate JSON
        run: |
          python -m json.tool data/catalog.json > /dev/null
          python -m json.tool data/trends.json > /dev/null
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/trends.json
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Update 30-country travel intelligence'
            git push origin HEAD:main
          fi
