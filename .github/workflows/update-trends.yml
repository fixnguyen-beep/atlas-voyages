
name: Update travel trends

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-travel-trends
  cancel-in-progress: false

jobs:
  update-trends:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai

      - name: Check API key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing"
            exit 1
          fi
          echo "API key configured"

      - name: Generate trend data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/update_trends.py

      - name: Verify output
        run: |
          if [ ! -f data/trends.json ]; then
            echo "::error::data/trends.json not found"
            exit 1
          fi
          python -m json.tool data/trends.json > /dev/null
          echo "Trend data generated successfully"

      - name: Commit and push if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/trends.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update travel recommendations"
            git push origin HEAD:main
          fi
