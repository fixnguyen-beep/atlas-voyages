<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas voyages</title><style>:root{--bg:#f7f4ed;--ink:#283027;--muted:#6d7068;--green:#405943;--line:#ded9ce}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,serif}header{padding:22px 5%;display:flex;justify-content:space-between;gap:18px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}.brand{font-size:34px;letter-spacing:9px}.controls{display:flex;gap:9px;flex-wrap:wrap}input,select,button{padding:11px 14px;border:1px solid var(--line);border-radius:22px;background:white;color:var(--ink)}.hero{padding:58px 5%;background:linear-gradient(120deg,#dfe9df,#f3eadb)}h1{font-size:clamp(38px,6vw,68px);font-weight:normal;margin:0 0 10px}.updated{font:12px Arial;color:var(--muted)}main{display:grid;grid-template-columns:330px 1fr;gap:24px;padding:28px 5% 60px}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:19px}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.filters button.active,.country.active{background:var(--green);color:white}.countries{display:grid;gap:7px;max-height:720px;overflow:auto}.country{text-align:left;border-radius:9px}.tag{font:11px Arial;text-transform:uppercase;letter-spacing:1px;color:#657c66}h2{font-size:42px;font-weight:normal;margin:8px 0}.lead{font:16px/1.6 Arial;color:#595f58}.section{border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{border:1px solid var(--line);border-radius:12px;padding:15px;background:#fcfbf7}.card p,.source{font:13px/1.55 Arial;color:var(--muted)}.badge{font:10px Arial;background:#e6eee6;padding:4px 7px;border-radius:10px}.source a{color:var(--green)}.empty{font:14px Arial;color:var(--muted)}@media(max-width:820px){main{grid-template-columns:1fr}.countries{max-height:280px}}</style></head><body><header><div class="brand">ATLAS</div><div class="controls"><input id="search" placeholder="Rechercher un pays"><select id="mode"><option value="couple">Voyage en couple</option><option value="family">Voyage en famille</option></select></div></header><div class="hero"><h1>L’art de voyager, autrement.</h1><p id="updated" class="updated"></p></div><main><aside class="panel"><div id="filters" class="filters"></div><div id="countries" class="countries"></div></aside><section id="detail" class="panel"></section></main><script>let D=[],continent='Tous',selected='';const E=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const U=s=>{try{let u=new URL(s);return u.protocol==='https:'?u.href:'#'}catch{return'#'}};const F=s=>s?new Date(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}):'date non précisée';function render(){const mode=document.getElementById('mode').value,q=search.value.toLocaleLowerCase('fr'),cs=['Tous',...new Set(D.map(x=>x.continent))];filters.innerHTML=cs.map(c=>`<button data-c="${E(c)}" class="${c===continent?'active':''}">${E(c)}</button>`).join('');const rows=D.filter(x=>(continent==='Tous'||x.continent===continent)&&x.destination.toLocaleLowerCase('fr').includes(q));countries.innerHTML=rows.map(x=>`<button data-d="${E(x.destination)}" class="country ${x.destination===selected?'active':''}">${E(x.destination)}</button>`).join('');let x=D.find(i=>i.destination===selected)||rows[0]||D[0];if(!x)return;selected=x.destination;let p=x.profiles?.[mode]||{},hotels=p.hotels||[],advice=p.advice||[];detail.innerHTML=`<div class="tag">${E(x.continent)} · ${E(p.label||mode)}</div><h2>${E(x.destination)}</h2><p class="lead">${E(p.summary||x.summary)}</p><p class="lead"><b>Angle :</b> ${E(p.angle)}</p><div class="section"><h3>10 hôtels pour ce voyage</h3><div class="cards">${hotels.map((h,i)=>`<article class="card"><span class="badge">${i+1}/10 · ${h.status==='web_researched'?'recherche web':'sélection éditoriale'}</span><h4>${E(h.name)}</h4><p><b>${E(h.location)}</b><br>${E(h.description)}</p>${h.source_url?`<div class="source">Source : <a target="_blank" rel="noopener" href="${U(h.source_url)}">${E(h.source_publisher)}</a>${h.published_at?' · '+F(h.published_at):''}</div>`:''}${h.official_url?`<div class="source"><a target="_blank" rel="noopener" href="${U(h.official_url)}">Site officiel</a></div>`:''}</article>`).join('')||'<p class="empty">Lancez le workflow pour produire les 10 recommandations sourcées.</p>'}</div></div>${advice.length?`<div class="section"><h3>Conseils adaptés</h3><div class="cards">${advice.map(a=>`<article class="card"><h4>${E(a.title)}</h4><p>${E(a.detail)}</p><div class="source"><a target="_blank" rel="noopener" href="${U(a.source_url)}">${E(a.source_publisher)}</a></div></article>`).join('')}</div></div>`:''}<div class="section"><h3>Préparer le voyage</h3><p class="lead"><b>Quand :</b> ${E(x.practical.when)} · <b>Durée :</b> ${E(x.practical.duration)}</p><p class="lead">${E(p.practical_note)}</p><p class="lead"><b>Le regard de l’Atlas :</b> ${E(p.verdict)}</p></div>`}document.addEventListener('click',e=>{let c=e.target.closest('[data-c]'),d=e.target.closest('[data-d]');if(c){continent=c.dataset.c;render()}if(d){selected=d.dataset.d;render()}});search.addEventListener('input',render);mode.addEventListener('change',render);fetch('./data/trends.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{D=j.items||[];updated.textContent='Dernière mise à jour : '+F(j.generated_at);selected=D[0]?.destination||'';render()}).catch(()=>detail.innerHTML='<p class="empty">Impossible de charger les données.</p>');</script></body></html>
